name: ubumwe_connect
description: "Ubumwe Connect - AI-powered real-time multilingual communication platform. Bringing People Together Beyond Language."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Navigation
  go_router: ^14.1.4

  # Firebase
  firebase_core: ^2.31.1
  firebase_auth: ^4.20.0
  cloud_firestore: ^4.17.4
  firebase_messaging: ^14.9.4
  firebase_storage: ^11.7.7
  flutter_local_notifications: ^17.1.2
  google_sign_in: ^6.2.1

  # Networking
  dio: ^5.4.3+1
  web_socket_channel: ^2.4.5

  # Media
  image_picker: ^1.1.1
  record: ^5.1.2
  audioplayers: ^6.0.0
  flutter_webrtc: ^0.10.6
  permission_handler: ^11.3.1
  cached_network_image: ^3.3.1
  photo_view: ^0.15.0
  file_picker: ^8.0.6

  # UI & Utilities
  timeago: ^3.6.1
  intl: ^0.19.0
  lottie: ^3.1.0
  shimmer: ^3.0.0
  flutter_svg: ^2.0.10+1
  badges: ^3.1.2
  flutter_animate: ^4.5.0

  # Storage
  shared_preferences: ^2.2.3
  flutter_secure_storage: ^9.0.0

  # Utils
  uuid: ^4.4.0
  equatable: ^2.0.5
  json_annotation: ^4.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.9
  json_serializable: ^6.8.0
  riverpod_generator: ^2.4.0
  mockito: ^5.4.4

dependency_overrides:
  # Fix the named argument mismatch in the published record_web 1.1.9 source.
  record_web:
    path: packages/record_web
  # record_linux 0.7.2 is incompatible with record_platform_interface 1.6.0.
  record_linux: ^1.3.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
