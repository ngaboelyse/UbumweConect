worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Logging
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct=$upstream_connect_time uht=$upstream_header_time urt=$upstream_response_time';
    access_log /var/log/nginx/access.log main;

    # Performance
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    gzip on;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header Content-Security-Policy "default-src 'self' http: https: data: blob: 'unsafe-inline'" always;

    # Hide nginx version
    server_tokens off;

    # Rate limiting zones
    limit_req_zone $binary_remote_addr zone=api_general:10m rate=60r/m;
    limit_req_zone $binary_remote_addr zone=api_auth:10m rate=10r/m;
    limit_req_zone $binary_remote_addr zone=api_translate:10m rate=30r/m;

    # Upstream FastAPI backend
    upstream backend {
        least_conn;
        server backend:8000 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    # HTTP → HTTPS redirect (development: pass through)
    server {
        listen 80;
        server_name _;

        # Health check endpoint (no rate limiting)
        location /health {
            proxy_pass http://backend/health;
            access_log off;
        }

        # API
        location /api/ {
            limit_req zone=api_general burst=20 nodelay;

            # Auth endpoints — stricter rate limiting
            location /api/v1/auth/login {
                limit_req zone=api_auth burst=5 nodelay;
                proxy_pass http://backend;
                include /etc/nginx/conf.d/proxy_params.conf;
            }
            location /api/v1/auth/register {
                limit_req zone=api_auth burst=3 nodelay;
                proxy_pass http://backend;
                include /etc/nginx/conf.d/proxy_params.conf;
            }

            # Translation endpoints
            location /api/v1/translation/ {
                limit_req zone=api_translate burst=10 nodelay;
                proxy_pass http://backend;
                include /etc/nginx/conf.d/proxy_params.conf;
            }

            proxy_pass http://backend;
            include /etc/nginx/conf.d/proxy_params.conf;
        }

        # WebSocket connections
        location /ws/ {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 86400;  # 24 hours for long-lived connections
            proxy_send_timeout 86400;
        }

        # File uploads — larger body size
        location /api/v1/users/avatar {
            client_max_body_size 10m;
            proxy_pass http://backend;
            include /etc/nginx/conf.d/proxy_params.conf;
        }

        # Default client body size
        client_max_body_size 5m;
    }
}
