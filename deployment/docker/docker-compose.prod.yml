version: "3.9"

# ============================================================
# Ubumwe Connect - Docker Compose (Production Overrides)
# Usage: docker-compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# ============================================================

services:

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports: []  # Not exposed externally in prod
    restart: always
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "1.0"

  redis:
    command: >
      redis-server
      --appendonly yes
      --requirepass ${REDIS_PASSWORD}
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
    ports: []  # Not exposed externally in prod
    restart: always

  backend:
    image: ${DOCKER_REGISTRY}/ubumwe-backend:${IMAGE_TAG:-latest}
    build:
      context: ../../backend
      dockerfile: Dockerfile
      target: production
    environment:
      DATABASE_URL: postgresql+asyncpg://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      SECRET_KEY: ${SECRET_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      FIREBASE_CREDENTIALS_JSON: ${FIREBASE_CREDENTIALS_JSON}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET}
      AWS_S3_REGION: ${AWS_S3_REGION}
      CORS_ORIGINS: ${CORS_ORIGINS}
      DEBUG: "false"
      WORKERS: "4"
    volumes:
      - backend_uploads:/app/uploads
    ports: []  # Behind nginx, not exposed directly
    restart: always
    deploy:
      replicas: 2
      resources:
        limits:
          memory: 1G
          cpus: "1.0"
      update_config:
        parallelism: 1
        delay: 10s
        failure_action: rollback
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3

  nginx:
    volumes:
      - ../nginx/nginx.prod.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro  # SSL certificates
      - certbot_webroot:/var/www/certbot:ro
    restart: always

  # ----------------------------------------------------------
  # Certbot for SSL (Let's Encrypt)
  # ----------------------------------------------------------
  certbot:
    image: certbot/certbot:latest
    container_name: ubumwe_certbot
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt
      - certbot_webroot:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done'"
    networks:
      - ubumwe_net

volumes:
  certbot_webroot:
    name: ubumwe_certbot_webroot
